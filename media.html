<!DOCTYPE html>
<html lang="th" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work24 - มัลติมีเดีย</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Prompt', 'Tahoma', 'sans-serif'] },
                    colors: { dessert: { bg: '#FAF6F0', primary: '#E88D67', secondary: '#99A799', accent: '#F3E9DD', text: '#5C3D2E' } },
                    boxShadow: { 'soft': '0 10px 40px -10px rgba(92, 61, 46, 0.1)', 'hover': '0 20px 40px -10px rgba(232, 141, 103, 0.25)' }
                }
            }
        }
    </script>
    <style>
        body { background-color: #FAF6F0; color: #5C3D2E; }
        .glass-nav { background: rgba(250, 246, 240, 0.85); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(232, 141, 103, 0.1); }
        .bua-loy-bowl {
            position: relative; width: 100%; height: 200px; background: #F3E9DD; border-radius: 1rem; overflow: hidden; box-shadow: inset 0 4px 10px rgba(0,0,0,0.05);
        }
        .bowl {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); width: 140px; height: 70px; background: white; border-bottom-left-radius: 70px; border-bottom-right-radius: 70px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); z-index: 10;
        }
        .ball { position: absolute; width: 30px; height: 30px; border-radius: 50%; z-index: 5; animation: bounce-ball 1.5s cubic-bezier(0.28, 0.84, 0.42, 1) infinite alternate; }
        .ball-pink { background: #FFB6B9; left: calc(50% - 40px); animation-delay: 0s; }
        .ball-green { background: #99A799; left: calc(50% + 10px); animation-delay: 0.3s; }
        .ball-yellow { background: #FCE38A; left: calc(50% - 15px); animation-delay: 0.6s; z-index: 6; width: 35px; height: 35px; }
        @keyframes bounce-ball {
            0% { bottom: 60px; transform: scaleY(0.9); }
            100% { bottom: 130px; transform: scaleY(1.05); }
        }
    </style>
</head>
<body class="antialiased">

    <audio id="bg-music" loop>
        <source src="https://cdn.discordapp.com/attachments/1561279279466160138/1561290565801353357/sonican-lo-fi-music-loop-sentimental-jazzy-love-473154.mp3?ex=6ad5d0a6&is=6ad47f26&hm=d7806fa6c2e6da842d5efa2aaddbbb42f1531a7d1f1887089698627a57e282f5&" type="audio/mpeg">
    </audio>

    <div id="music-container" class="fixed top-24 right-4 md:right-6 z-50 bg-[#FFB6B9] hover:bg-[#FF9A9E] text-[#5C3D2E] rounded-full p-2 md:px-4 md:py-2.5 shadow-lg transition-all duration-300 flex items-center gap-2 md:gap-3 border-2 border-white group">
        <button id="music-toggle" class="flex items-center justify-center gap-2 cursor-pointer outline-none">
            <span id="music-icon" class="text-xl group-hover:animate-bounce transition-transform">🔇</span>
            <span id="music-text" class="hidden md:inline font-medium text-sm whitespace-nowrap">เล่นเพลง</span>
        </button>
        <div class="w-px h-5 bg-[#5C3D2E]/20 hidden sm:block"></div>
        <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="0.5" title="ปรับระดับเสียง" class="hidden sm:block w-16 md:w-20 h-1.5 bg-white/60 rounded-lg appearance-none cursor-pointer accent-[#5C3D2E]">
    </div>

    <nav class="glass-nav fixed w-full top-0 z-50 transition-all duration-300">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-20">
                <a href="index.html" class="flex-shrink-0 flex items-center">
                    <span class="font-bold text-2xl text-dessert-primary tracking-wide">Thai<span class="text-dessert-text">Desserts</span></span>
                </a>
                <div class="hidden md:flex space-x-8">
                    <a href="index.html" class="text-dessert-text hover:text-dessert-primary font-medium transition-colors">หน้าแรก</a>
                    <a href="history.html" class="text-dessert-text hover:text-dessert-primary font-medium transition-colors">ประวัติความเป็นมา</a>
                    <a href="recipes.html" class="text-dessert-text hover:text-dessert-primary font-medium transition-colors">วิธีทำขนม</a>
                    <a href="media.html" class="text-dessert-primary font-bold transition-colors">มัลติมีเดีย</a>
                    <a href="team.html" class="text-dessert-text hover:text-dessert-primary font-medium transition-colors">สมาชิกจัดทำ</a>
                </div>
            </div>
        </div>
    </nav>

    <section class="py-32 bg-white min-h-screen">
        <div class="max-w-6xl mx-auto px-4">
            <div class="text-center mb-16">
                <h2 class="text-4xl font-bold text-dessert-text mb-4">มัลติมีเดียและแกลเลอรี</h2>
                <div class="w-24 h-1 bg-dessert-primary mx-auto rounded-full"></div>
                <p class="text-gray-600 mt-4">รวบรวมภาพ วิดีโอ และเสียงประกอบสำหรับผลงาน</p>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-2 gap-12">
                <div class="space-y-8">
                    <div class="bg-dessert-bg p-4 rounded-3xl shadow-soft">
                        <h3 class="text-lg font-semibold mb-3 px-2">🎬 สื่อวิดีโอ</h3>
                        <video class="w-full rounded-2xl shadow-inner outline-none" controls poster="https://media.discordapp.net/attachments/1561279279466160138/1561282315009794048/Gemini_Generated_Image_qoogc7qoogc7qoog.jpg?ex=6ad5c8f7&is=6ad47777&hm=fa1574e742638fa30454dbb39ce9290748abfe77a6e1e6f09f92ac0ed85f61d0&=&format=webp">
                            <source src="https://cdn.discordapp.com/attachments/1561279279466160138/1561288940613402674/v2_awv-71d5a07d8b8aa285.mp4?ex=6ad5cf22&is=6ad47da2&hm=85b2ef6d59cac7e78f43a5788ad3c7aa855756a24a5026c6a8349746a7c7918b&" type="video/mp4">
                            เบราว์เซอร์ของคุณไม่รองรับวิดีโอ
                        </video>
                    </div>

                    <div class="bg-white border-2 border-dessert-accent p-6 rounded-3xl shadow-soft">
                        <h3 class="text-lg font-semibold mb-4">✨ บัวลอยเด้งดึ๋ง</h3>
                        <div class="bua-loy-bowl">
                            <div class="bowl"></div>
                            <div class="ball ball-pink"></div>
                            <div class="ball ball-green"></div>
                            <div class="ball ball-yellow"></div>
                        </div>
                    </div>
                </div>

                <div class="space-y-8">
                    <h3 class="text-lg font-semibold mb-4 px-2">📸 แกลเลอรีภาพ</h3>
                    <div class="grid grid-cols-2 gap-4">
                        <div class="overflow-hidden rounded-2xl shadow-soft">
                            <img src="https://cdn.discordapp.com/attachments/1561279279466160138/1561301999788494858/Gemini_Generated_Image_9vnkr99vnkr99vnk.jfif?ex=6ad5db4c&is=6ad489cc&hm=1cc24b6a0af0c732b74e03ab4fb3a8d2393ac7cee76b96657cf00ba6920bf365&0" alt="Gallery 1" class="w-full h-48 object-cover hover:scale-110 transition-transform duration-500">
                        </div>
                        <div class="overflow-hidden rounded-2xl shadow-soft">
                            <img src="https://cdn.discordapp.com/attachments/1561279279466160138/1561302999224029194/Gemini_Generated_Image_jwoar3jwoar3jwoa.jfif?ex=6ad5dc3a&is=6ad48aba&hm=881d76d1693846c5035737250789e3bb2eac6fbd7988b3d5b7344e854dac4b76&" alt="Gallery 2" class="w-full h-48 object-cover hover:scale-110 transition-transform duration-500">
                        </div>
                        <div class="col-span-2 overflow-hidden rounded-2xl shadow-soft">
                            <img src="https://cdn.discordapp.com/attachments/1561279279466160138/1561303237863407666/Gemini_Generated_Image_fc4wrdfc4wrdfc4w.jfif?ex=6ad5dc73&is=6ad48af3&hm=4e1ccb1fe40ff13643292a3f26400e33cde6c2b6e5c276983432e933b04dce0a&" alt="Gallery 3" class="w-full h-64 object-cover hover:scale-110 transition-transform duration-500">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <button id="back-to-top" onclick="window.scrollTo({top: 0, behavior: 'smooth'})" class="hidden fixed bottom-6 right-6 z-50 bg-dessert-primary text-white p-3 rounded-full shadow-lg hover:bg-orange-500 transition-all">
        ▲
    </button>

    <footer class="bg-dessert-text text-white py-8 text-center">
        <p class="font-light">© 2026 มนต์เสน่ห์แห่งขนมไทย | Assignment วิชา Multimedia System</p>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const bgMusic = document.getElementById('bg-music');
            const musicToggle = document.getElementById('music-toggle');
            const musicIcon = document.getElementById('music-icon');
            const musicText = document.getElementById('music-text');
            const volumeSlider = document.getElementById('volume-slider');
            const musicContainer = document.getElementById('music-container');
            const backToTop = document.getElementById('back-to-top');

            window.addEventListener('scroll', () => {
                if (window.scrollY > 300) backToTop.classList.remove('hidden');
                else backToTop.classList.add('hidden');
            });

            const savedVolume = localStorage.getItem('music_volume') || 0.5;
            const isPlaying = localStorage.getItem('music_playing') === 'true';
            const savedTime = parseFloat(localStorage.getItem('music_time') || 0);

            bgMusic.volume = savedVolume;
            volumeSlider.value = savedVolume;
            bgMusic.currentTime = savedTime;

            function updateUI(playing) {
                if (playing) {
                    musicIcon.textContent = '🎵';
                    musicText.textContent = 'หยุดเพลง';
                    musicContainer.classList.replace('bg-[#FFB6B9]', 'bg-[#FF9A9E]');
                } else {
                    musicIcon.textContent = '🔇';
                    musicText.textContent = 'เล่นเพลง';
                    musicContainer.classList.replace('bg-[#FF9A9E]', 'bg-[#FFB6B9]');
                }
            }

            if (isPlaying) {
                bgMusic.play().then(() => updateUI(true)).catch(() => {
                    document.addEventListener('click', function startPlay() {
                        bgMusic.play();
                        updateUI(true);
                        localStorage.setItem('music_playing', 'true');
                        document.removeEventListener('click', startPlay);
                    }, { once: true });
                });
            }

            bgMusic.addEventListener('timeupdate', () => {
                localStorage.setItem('music_time', bgMusic.currentTime);
            });

            musicToggle.addEventListener('click', (e) => {
                e.stopPropagation();
                if (bgMusic.paused) {
                    bgMusic.play();
                    localStorage.setItem('music_playing', 'true');
                    updateUI(true);
                } else {
                    bgMusic.pause();
                    localStorage.setItem('music_playing', 'false');
                    updateUI(false);
                }
            });

            volumeSlider.addEventListener('input', (e) => {
                bgMusic.volume = e.target.value;
                localStorage.setItem('music_volume', e.target.value);
            });
        });
    </script>
</body>
</html>
