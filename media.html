    <button id="back-to-top" onclick="window.scrollTo({top: 0, behavior: 'smooth'})" class="hidden fixed bottom-6 right-6 z-50 bg-dessert-primary text-white p-3 rounded-full shadow-lg hover:bg-orange-500 transition-all">▲</button>

    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const bgMusic = document.getElementById('bg-music');
            bgMusic.volume = 0.5;

            const savedTime = parseFloat(localStorage.getItem('music_time') || 0);
            bgMusic.currentTime = savedTime;

            const playAudio = () => {
                bgMusic.play().catch(() => {});
            };

            bgMusic.play().catch(() => {
                document.addEventListener('click', playAudio, { once: true });
            });

            bgMusic.addEventListener('timeupdate', () => {
                localStorage.setItem('music_time', bgMusic.currentTime);
            });

            const backToTop = document.getElementById('back-to-top');
            window.addEventListener('scroll', () => {
                if (window.scrollY > 300) backToTop.classList.remove('hidden');
                else backToTop.classList.add('hidden');
            });
        });
    </script>
